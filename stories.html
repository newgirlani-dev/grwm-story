					<div class="story-card" onclick="openModal(this)"
						data-title="Joann's Morena Story"
						data-story="
							My favorite Morena story is being a content creator for you guys. It's not just about being a shade reference, it's also about making a statement, it's about being visible, to show my lived experience, to let the younger audience know how Morena beauty should be celebrated. While I enjoy making content and being in front of the camera, I enjoy doing this entire journey with you, my beautiful, loving, and kind community the most. 

							Once a bullied teenager to somebody standing up for the community, all possible because once again, the only thing more powerful than hate is love. 

						">
						<img src="assets/stories/joann.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="KM's Morena Story"
						data-story="
							BEING A MORENA IS NOT THE SAME AS BEING DIRTY 

							Back when I was still in elementary school, I was always bullied because of my skin color. Some people would call me names. Even my mom would make me use whitening soaps because she said I was too dark. She would joke that she couldn't even see me when the lights were off, and there's this one incident that has never really left my mind.

							There was also this one mom who said, 'Wala ka nagtarong panglugod while naligo ka, no?' She was talking to her son about the dark spots on his arm and telling him to scrub properly. Then she looked at me and said those words again at me.

							Because of that incident, I always thought that maybe I was full of libag. So every day, I exfoliated like crazy, thinking it would make me whiter.

							I started loving my skin when I saw a lot of content creators who are also morenas. That's when I realized that this is really who I am. I'm beautiful with my skin color, and it's one of the things that makes me stand out.

							My skin was never the problem. The way people viewed it was.

						">
						<img src="assets/stories/km.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Feb's Morena Story"
						data-story="
						I have always been a morena since I was a kid, and I have never really been ashamed of it. But growing up, I often wondered why my skin was brown while other kids had fairer skin. There were moments when I would think, “Maypa puti sad ko no?”

						I also struggled with my insecurities, especially with my discoloration on my underarms, inner thighs, knees, and elbows. It was hard hearing comments like, “Ka negra nimo oy,” or “Gwapa unta, itom lang.” In school, I even remember being told that my role should be “kahoy” because of my skin color.

						One of the most recent moments that really stuck with me was when I was going to the beach and a relative commented, “Gwapa kuno pero itom kaayo.” Thankfully, my mama was there and she immediately said, “Wala mana siyay pake ana kay gwapa man siya.” Purr, mama! 🤎

						That moment gave me more confidence to finally flaunt and embrace my morena skin. Although there are still times when morenas experience judgment and shame, I have learned to appreciate and love the skin I’m in.

						Seeing morena creators like Ayn Bernos, who continue to empower women through their platform, and of course you, Miss Jo, inspires me even more. I see how you use your platform to uplift morenas and Cebuanas like me, to embrace our beauty, our identity, and our morenahood. 🤎

						Because Morena is not something we have to change. It is something we get to celebrate.

						">
						<img src="assets/stories/feb.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Janna's Morena Story"
						data-story="
						Nako sa school back when I was 13yrs old, i was bullied because sakong skin tone kay lagi MORENA ko, naghulat nalang mig bell ato kay manguli ka lagi mi so after pila ka minutes nag bell na, nako's gym gahulat sakong ate kay sabay mi ga uli, while waiting sakong ate naay kid . Then the little kid looked at me and said 'ate parihas ta ug skin color, same gwapa' ni smile ko saiyaha and ge ingnan nako siyag 'pretty kayo ta no kay ani atong color' then ni smile siya pagkatapos gitawag na siya saiyang mama. After pod ana na abot na akong ate. Take note i was bullied because of my skin color pero hindi ako magpapadala sa mga sinasabi nila because i know to my self nga 'GWAPA KO UG CONFIDENCE KO SAKONG SKIN COLOR'

						And just like that na realize nako, you weren't waiting for a crown. You were the crown. The one girls like us needed to see.

						Mao ning most memorable part sakong story as a morena, not just they finally 'got it'. But 'when you got it' naka ingon ko sakong sarili nga i am enough all along. 

						">
						<img src="assets/stories/janna.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Sky's Morena Story"
						data-story="
						Growing up as a morena, I honestly believed that lighter skin was the standard of beauty. I remember hearing comments like, 'Ang ganda mo sana kung maputi ka lang', or people casually recommending whitening products as if there was something wrong with my skin. Kahit hindi nila intensyon manakit, those words stayed with me for years.

						There was a time when I avoided taking pictures under the sun because I thought I looked 'too dark.' I even found myself comparing my skin to others and wishing I looked different. Looking back, it breaks my heart that I spent so much time trying to become someone I was never meant to be.

						As I grew older, I realized that the problem was never my skin. it was the beauty standards I grew up seeing. Seeing morena women proudly embracing their skin, confidently wearing makeup that celebrates their complexion instead of hiding it, slowly changed the way I saw myself. They made me realize that being morena isn't something to fix because it's something to be proud of.

						Now, whenever I see brands becoming more inclusive and creators advocating for morena representation, I feel seen. It reminds me that little girls growing up today deserve to see faces that look like theirs and know they're beautiful exactly as they are.

						Hindi natin kailangang pumuti para maging maganda. Ang kailangan nating baguhin ay ang mindset na may mas 'lamang' ang maputi kaysa morena. Hindi kailangang baguhin ng morena ang balat niya para tanggapin ng mundo. Ang dapat magbago ay ang pamantayan ng mundo. 

						">
						<img src="assets/stories/sky.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Kim's Morena Story"
						data-story="
						Growing up, I really didn't give much attention to what people say to my skin. My family loves going to the beach and I always enjoy my time there. When I go to school the next day, my classmates would point out how sunburned my skin was. I would just shrugg it off and say 'Okay lang yan, nag-enjoy naman ako.' Given that I have curly hair and dark skintone, they call me 'Negra' or 'Negrita.'

						Even so, I still love myself for who I am. Still, as a person who has feelings, I think of it sometimes. Those what ifs, 'What if I have fair skin?' or 'What if my hair was straight?' Would it really give me enough confidence if I met their standard? Now that I grew older, I've been seeing women who are embracing their own beauty, like you Ms. Jo/mygirlani, especially their morena features. It gives me courage to try and embrace mine too. 
						">
						<img src="assets/stories/kim.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Atasha's Morena Story"
						data-story="
						Growing up, I was often told that I was pretty, but different because of my morena skin and features. As a child, I never thought being morena made me different from others. It wasn't until high school that I became more aware of it. During that time, whitening products became popular, and having fair skin was often considered the standard of beauty.

						Like many others, I tried using whitening products, hoping to fit that beauty standard. However, my sensitive skin reacted badly, and I eventually stopped using them. What encouraged me to embrace my natural skin tone was hearing people around me say that they actually preferred my morena complexion.

						Then the pandemic happened. While scrolling through TikTok, I came across content creators who confidently embraced their morena beauty. Seeing their confidence inspired me to appreciate my own skin and recognize its beauty. From that moment on, I became more confident in myself.

						Today, I am happy that morena beauty is being celebrated more openly. Beauty products are now becoming more inclusive and are designed for people like me. My journey taught me that true beauty comes from embracing who you are, and I am proud to be morena.
						">
						<img src="assets/stories/atasha.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Jamaican's Moreno Story"
						data-story="
						I used to think my skin needed to change, not because I didn’t like it but because the world kept telling me it should be something else—lighter, brighter, different; I heard it in jokes, in ads, in quiet comparisons I wasn’t meant to notice, but one day I looked at myself under the sun, no perfect lighting, no filters, just real, and I saw it—my moreno skin glowing the way it was meant to, warm, alive, strong, not something that needed fixing but something that had always been beautiful; from that moment I stopped asking if I was enough because I already was, and now I walk with pride, not because I proved anything to others but because I finally chose myself; I love my skin not just for how it looks but for what it represents—my roots, my story, my strength; I am moreno and I am proud.
						">
						<img src="assets/stories/jamaican.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Sophia's Morena Story"
						data-story="
						IMy most memorable morena story is growing up with the mentality that being fair-skinned is the only kind of beautiful that should be celebrated and then having to realize that some of the most beautiful and confident people in the world is not even close to having fair skin or white but they were comfortable in the skin that they’re in. Venus Raj, Anok Yai, Beyoncé, Inka Magnaye, and etc., looking up to these beautiful women opened up my eyes that beauty should not be measured by shade or the color of the skin but by how you walk in it. 

						Colonial mentality has deeply planted its roots in our culture but we’ve come a long way. 

						Layo pa, pero layo na.

						All love, morenas! <3
						">
						<img src="assets/stories/sophia.svg" class="stories-img">
					</div>


					<div class="story-card" onclick="openModal(this)"
						data-title="Lorraine's Morena Story"
						data-story="
						Growing up as a morena, I used to hate my skin so much—to the point that I even hated makeup because I thought it was only for people with lighter skin. There were times when I felt like I stood out too much whenever I wore makeup because I believed it didn’t suit me.

						But as I grew older and surrounded myself with people who shared the same struggles yet remained confident in their skin tone, I slowly started to feel better about myself too. And when I discovered many TikTok creators, including you, I realized that I wasn’t alone. Seeing these beautiful women so comfortable and confident in their morena skin made me think, “Maybe I should be too,” because there is absolutely nothing wrong with it. In fact, people spend huge amounts of money trying to achieve this kind of skin tone.

						Now that I’m 20 years old, I no longer have insecurities about my skin color because it is finally being recognized and celebrated. Even though I still sometimes struggle to find the right makeup shades that complement my skin tone, I have fully embraced it because this is God’s gift to me.

						As someone who loves makeup just as much as you do, thank you for being an inspiration to so many people. Thank you for building a community where morena girls are celebrated and appreciated.

						">
						<img src="assets/stories/lorraine.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Abigail's Morena Story"
						data-story="
						I’d love to tell you that beauty standards which don't cater to me made me insecure about my tan skin. Except it didn’t. Don’t get me wrong — I was and am insecure. I had to learn how to love myself after years of avoiding mirrors and cameras. But what made me uncertain is not my skin tone, but more pressing issues, like my teeth and hair. As far as I’m concerned, I was ugly because of many other traits, and not because I was morena.

						I got into makeup as an extension of my creative pursuits. When I had my face as my canvas, it was then I could stare at myself finally. Even though I would stare at myself to see which parts I could perfect, I could stare, nevertheless. And that was enough for me.

						Naturally, off I went to buy more products. On the shelves, there were two shades: light, and lighter. On apps, there were orange, pink, and white-yellow. Lip products were too pale on me, too bright, too everything, but never just enough. It was then I realized the plights of us morenas, and my plights were doubled with my olive overtone. The market does place morenas on the backburner, and olive girlies are at the bottom of the shelf.

						I cannot very well afford to buy every product which promised to fit my skin tone, and so I took it upon myself. With my art skills that brought me to makeup in the first place, I used pale foundations as highlights and contours to ground it closer to my skintone. I scraped my brown eyeshadows from the Ever Bilena Pro Rich Palette and melted down my Issy Creme Blush in Purr and Detail Colour Tonic in Flamingo to create my own blushes. I uncapped my foundations and concealers and squeezed into it brown and blue pigments so that it may fit my skin tone.

						Like Filipinos who build solar panels because they cannot trust the electricity providers, or those who buy their own vehicles to escape jeeps and buses that are filled to the brim when they are most needed — I, a teenage Filipino girl, cater to my own needs because the market refuses to cater to me. Is that not Filipino resilience at work?

						And so, if there’s anything I love most in the advent of influencer marketing, it’s the morena influencers who take it upon themselves to model shades of a brand which refuses to hire models for every single skin tone. A morena’s “I bought this, so you don’t have to,” is music to the ears of their morena siblings behind screens and store fronts. 

						I am sure we are heading to a future where we are as loved by the makeup brands and cosmetic industry we choose to patronize. But until then, my gratitude is for you, my beloved morena creators, who try on the foundations, concealers, blushes and lipsticks so that I don’t have to know that it was too light, too orange, too yellow or pink on me after my hard-earned money is already spent. 

						From the depth of my soul, thank you.

						">
						<img src="assets/stories/abigail.svg" class="stories-img">
					</div>

					<div class="story-card" onclick="openModal(this)"
						data-title="Anarose's Moreno Story"
						data-story="
						Since I was in elementary, I had always got called 'negra' because of my skin color and I thought it's normal because I'm still a kid and all I wanted to do is to play under the sun, wala akong pake on what they want to say about my skin color not until some of relatives made me feel that being tanned skin is like a weakness that you must end because a lot of my cousins are light skinned. Every time there's a family picture, I always got compared to my cousins kasi para daw akong uling pagkatabi nila. Then suddenly, I got in highschool where puberty hits me. I got conscious about my skin being so tan but I am a very sporty girl, I played sepak takraw, softball, running and volleyball even I know that it will darkened my skin even more. 

						After every sports event, I had always got teased because of my skin and even my teachers too and it was when I'm grade 9. But, behind all of that I can't stop playing 'cause it's what makes me happy, when i'm under the sun, being me, having the life in its fullest and forgetting those people who's will tease me after the game because of my skin color. Now, I'm in college and I was brainwashed, I've got distracted by a lot of people around me. I started to feel insecure again about my skin, I want to have a light skin as what so many people see as the standard of beauty. Many says that being morena is beautiful but only for those who have a good facial features and if you don't then they'll see you as someone na 'hindi nag aayos' or 'dugyot' a very harsh thing to say to a person. 

						I am not photogenic that's why I don't take pictures often and if I does, I'll always put filters on and especially the skin complexion enhancer. I wanted to fit in the standard of others that's why I was so obsessed to whitening products whether it's soaps, lotion or whitening capsules. I tend to save money just to buy those things kahit na wala ng matira sa allowance ko. But, you came across my fyp, your words of affirmation about being a morena made me realized something where being morena is not a weakness but a strength to be proud of. 

						I've got a realization after watching your videos that it's okay not to fit in their standards, it's okay to be different, it's okay to be who you really are and it's okay to be morena in the room of people with light skinned. 
						">
						<img src="assets/stories/anarose.svg" class="stories-img">
					</div>


				</div>
